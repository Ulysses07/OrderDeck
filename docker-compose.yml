# YEREL GELİŞTİRME compose'u. Secret'lar .env'den okunur (bkz. .env.example);
# repo'da hardcoded parola YOK. Prod bunu KULLANMAZ — prod deploy/docker-compose.yml
# + VPS /opt/orderdeck/.env kullanır.
#   Kullanım:  cp .env.example .env  &&  docker compose up
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: "${MSSQL_SA_PASSWORD:?.env dosyasinda ayarla (bkz. .env.example)}"
    ports:
      - "1433:1433"
    volumes:
      - mssql-data:/var/opt/mssql

  license-server:
    build:
      context: .
      dockerfile: OrderDeck.LicenseServer/Dockerfile
    environment:
      ConnectionStrings__LicenseDb: "Server=sqlserver;Database=OrderDeckLicense;User=sa;Password=${MSSQL_SA_PASSWORD:?.env dosyasinda ayarla};TrustServerCertificate=true;"
      Jwt__SecretKey: "${JWT_SECRET:?.env dosyasinda ayarla (bkz. .env.example)}"
      Jwt__Issuer: "orderdeck-license-server"
      Email__Provider: "disk"
      App__PublicBaseUrl: "http://localhost:8080"
      # Konteyner artık root koşmuyor (bkz. Dockerfile `USER $APP_UID`, uid 1654).
      # /app imaj katmanında root'a ait, yani ORAYA YAZAN her varsayılan kırılır:
      #   - Smtp:DiskOutputDirectory varsayılanı "./tmp/emails" → /app/tmp/emails
      #   - Backup:StorageRoot varsayılanı "/app/Backups"
      # İkisi de Directory.CreateDirectory ile açılıyor ve UnauthorizedAccess atar.
      # Yazılabilir tek yer /tmp (1777). Prod'da bu yollar bind mount + chown 1654.
      Smtp__DiskOutputDirectory: "/tmp/emails"
      Backup__StorageRoot: "/tmp/backups"
      # $HOME=/home/app ama o dizin imajda YOK ve /home root'a ait → varsayılan
      # anahtar yolu açılamaz, DataProtection sessizce geçici (bellekte) anahtara
      # düşer. Yerelde kalıcılık gerekmiyor ama yolu vermek uyarıyı susturur.
      DataProtection__KeysPath: "/tmp/dp-keys"
    ports:
      - "8080:8080"
    depends_on:
      - sqlserver

volumes:
  mssql-data:
