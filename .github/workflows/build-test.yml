name: build-test

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  build-test:
    # WPF projects target net10.0-windows, so the whole solution needs windows-latest.
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          # Pinned by global.json (rollForward latestFeature, allowPrerelease).
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore OrderDeck.sln

      - name: Build (Release)
        run: dotnet build OrderDeck.sln --configuration Release --no-restore --nologo

      # WPF/Dispatcher-heavy tests are excluded from CI for now. Locally
      # they pass cleanly (2.5 min serial, ~6s parallel), but Release
      # config on the GitHub Windows runner triggers a host-shutdown
      # deadlock — a DispatcherTimer attached during MainShellTestHarness
      # construction (GiveawayBannerViewModel) keeps a per-thread WPF
      # Dispatcher alive past the last test, blocking process exit.
      # Tracked as separate tech debt: make MainShellTestHarness +
      # GiveawayBannerViewModelTests dispose VMs and shut down the
      # test-thread Dispatcher explicitly. Until then, keep the runner
      # green and rely on local execution for the excluded suites.
      - name: Test - OrderDeck.Tests (Core/App)
        run: >
          dotnet test OrderDeck.Tests/OrderDeck.Tests.csproj
          --configuration Release --no-build --no-restore --nologo
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=core-app.trx"
          --results-directory ${{ github.workspace }}/TestResults
          --blame-hang-timeout 3m
          --filter "FullyQualifiedName!~MainShell&FullyQualifiedName!~GiveawayBannerViewModel"
          -- xUnit.ParallelizeTestCollections=false

      - name: Test - OrderDeck.Licensing.Tests
        run: >
          dotnet test OrderDeck.Licensing.Tests/OrderDeck.Licensing.Tests.csproj
          --configuration Release --no-build --no-restore --nologo
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=licensing.trx"
          --results-directory ${{ github.workspace }}/TestResults
          --blame-hang-timeout 5m

      # Sunucu testleri artık ayrı bir işte (license-server-test), ubuntu'da.
      # Sebep aşağıda.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: warn

  # Sunucu testleri — ubuntu, çünkü bir kısmı gerçek SQL Server container'ı
  # istiyor.
  #
  # Neden Windows işinden çıkarıldı: suite'in çoğu InMemory'de koşuyor ama
  # InMemory'de eşzamanlılık semantiği yok — aynı satıra iki eşzamanlı yazma
  # yarışmıyor. Refresh token rotasyonunun tek kullanımlık olduğunu ancak
  # gerçek bir veritabanına karşı kanıtlayabiliyoruz (bkz.
  # RefreshTokenConcurrencyTests). Testcontainers Linux container'ı açıyor;
  # windows-latest runner'ında bu çalışmaz.
  #
  # Filtre/etiketle ayırmak yerine işin tamamı buraya taşındı: etiket koymayı
  # unutan bir sonraki test yanlış runner'da patlardı. Ayrıca prod zaten
  # Linux — burada koşmak parite açısından da daha doğru.
  #
  # Proje net10.0 (WPF yok), o yüzden solution'a değil doğrudan csproj'a
  # kuruluyor.
  license-server-test:
    runs-on: ubuntu-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@0057852bfaa89a56745cba8c7296529d2fc39830 # v4.3.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      # NOTE: eski bayrak `xUnit.ParallelizeAssembly=false` idi — tek bir
      # .csproj koşarken bu etkisiz. İstediğimiz anahtar
      # `ParallelizeTestCollections=false` (assembly içi sıralama).
      - name: Test - OrderDeck.LicenseServer.Tests
        run: >
          dotnet test OrderDeck.LicenseServer.Tests/OrderDeck.LicenseServer.Tests.csproj
          --configuration Release --nologo
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=license-server.trx"
          --results-directory ${{ github.workspace }}/TestResults
          --blame-hang-timeout 5m
          -- xUnit.ParallelizeTestCollections=false

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: test-results-license-server
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: warn

  # Sunucu imajını PR'da DERLER, push ETMEZ.
  #
  # Neden ayrı bir iş: yukarıdaki build-test çözümün tamamını Windows'ta derliyor
  # ve Docker'a özel hiçbir şeyi sınamıyor. İmaj eskiden yalnız master'a push'ta
  # derleniyordu, yani Docker'a özgü her kırılma ilk kez PROD DEPLOY'unda ortaya
  # çıkıyordu — 2026-08-13'te tam bu oldu (PR #258 yeni bir ProjectReference
  # ekledi, Dockerfile'ın COPY listesi geri kaldı, restore projeyi sessizce atladı,
  # publish CS0234 ile patladı ve sunucu bir sürüm geride kaldı).
  #
  # Dockerfile artık `COPY . .` yaptığı için proje-grafiği ayrışması imkânsız
  # (bkz. #259); bu iş geriye kalanı yakalıyor: temel imaj sürümü, eksik native
  # bağımlılık, runtime katmanı hataları, .dockerignore'un yanlışlıkla gerekli bir
  # şeyi elemesi.
  #
  # Deploy iş akışı bu workflow'un SONUCUNA bağlı (workflow_run + conclusion ==
  # success), dolayısıyla bu iş kırmızıysa deploy da tetiklenmez.
  docker-build:
    # Linux imajı; build-test'in windows-latest'ında derlenemez.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Build image (push yok)
        uses: docker/build-push-action@ca052bb54ab0790a636c9b5f226502c73d547a25 # v5.4.0
        with:
          context: .
          file: OrderDeck.LicenseServer/Dockerfile
          push: false
          # Deploy iş akışıyla aynı gha önbelleğini okur; oradaki katmanlar
          # burada da işe yarar. mode=max ile YAZMIYOR: doğrulama koşusu
          # deploy'un önbelleğini kirletmesin.
          cache-from: type=gha
