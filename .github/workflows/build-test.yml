name: build-test

on:
  push:
    # GEÇİCİ: parçalı CI'ı PR açmadan ölçmek için. PR'dan önce kaldırılacak.
    branches: [main, master, chore/ci-server-test-shards]
  pull_request:
    branches: [main, master]

jobs:
  # Hangi işlerin koşacağına ve sunucu test matrisine karar verir (~15 sn).
  #
  # code: master'a push'ta HER ZAMAN true — deploy (license-server-deploy.yml,
  # workflow_run) eksiksiz test kanıtına dayanır. PR'da merge commit'i ilk
  # ebeveyniyle karşılaştırılır; değişen dosyaların hepsi docs/**, kökteki
  # *.md, web iş akışı ya da web/** ise false (sunucu testlerinin okuduğu web
  # dosyaları hariç; kural ve gerekçe .github/scripts/code-changed.py'de).
  #
  # İş akışı düzeyinde paths-ignore bilerek kullanılmadı: atlanan bir iş akışı
  # zorunlu check'i "Expected" durumunda bırakır ve master'da deploy zincirini
  # koparır. Burada iş akışı her zaman koşar, yalnız işler atlanır; atlanan iş
  # zorunlu check açısından başarılı sayılır.
  #
  # matrix: sunucu test parçaları. Tek kaynak bu iki sayı. İlişkisel zincir
  # büyüdükçe (her yeni SQL Server testi ~4 sn) RELATIONAL_SHARDS artırılır;
  # toplayıcının yazdığı parça süreleri dengesizliği gösterir.
  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      RELATIONAL_SHARDS: 4
      INMEMORY_SHARDS: 2
    outputs:
      code: ${{ steps.code.outputs.code }}
      matrix: ${{ steps.matrix.outputs.matrix }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          # PR'da HEAD, base ile PR'ın merge commit'i; HEAD^1 = base ucu.
          fetch-depth: 2

      - name: Kod değişti mi
        id: code
        env:
          EVENT_NAME: ${{ github.event_name }}
        run: |
          set -euo pipefail
          if [ "$EVENT_NAME" != "pull_request" ]; then
            echo "$EVENT_NAME: her şey koşar."
            code=true
          else
            code=$(git diff --name-only --no-renames -z HEAD^1 HEAD | python3 .github/scripts/code-changed.py)
          fi
          echo "code=$code" | tee -a "$GITHUB_OUTPUT"

      - name: Sunucu test matrisi
        id: matrix
        run: |
          set -euo pipefail
          matrix=$(jq -cn --argjson r "$RELATIONAL_SHARDS" --argjson m "$INMEMORY_SHARDS" \
            '{include: ([range(0; $r) | {kind: "relational", index: ., count: $r}]
                      + [range(0; $m) | {kind: "inmemory", index: ., count: $m}])}')
          echo "matrix=$matrix" | tee -a "$GITHUB_OUTPUT"

  build-test:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # WPF projects target net10.0-windows, so the whole solution needs windows-latest.
    runs-on: windows-latest
    timeout-minutes: 25

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          # Pinned by global.json (rollForward latestFeature, allowPrerelease).
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Restore
        run: dotnet restore OrderDeck.sln

      - name: Build (Release)
        run: dotnet build OrderDeck.sln --configuration Release --no-restore --nologo

      # MainShell + GiveawayBannerViewModel suites used to be filtered out of
      # this step (2026-05-05, c3b0b46) because the runner hung. Root cause:
      # MainShellViewModel's ctor starts three DispatcherTimers and a running
      # DispatcherTimer sits in Dispatcher._timers behind a STRONG reference,
      # so every undisposed harness rooted its whole VM graph — SQLite
      # connection included — for the rest of the run. The old Dispose only
      # stopped two of the three, and no test called it at all. Measured:
      # 390 leaked timers over 130 harness builds; after the fix, 0.
      # Now unfiltered — the whole suite runs on CI again.
      - name: Test - OrderDeck.Tests (Core/App)
        run: >
          dotnet test OrderDeck.Tests/OrderDeck.Tests.csproj
          --configuration Release --no-build --no-restore --nologo
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=core-app.trx"
          --results-directory ${{ github.workspace }}/TestResults
          --blame-hang-timeout 3m
          -- xUnit.ParallelizeTestCollections=false

      - name: Test - OrderDeck.Licensing.Tests
        run: >
          dotnet test OrderDeck.Licensing.Tests/OrderDeck.Licensing.Tests.csproj
          --configuration Release --no-build --no-restore --nologo
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=licensing.trx"
          --results-directory ${{ github.workspace }}/TestResults
          --blame-hang-timeout 5m

      # Sunucu testleri ayrı işlerde (license-server-shard matrisi + toplayıcı
      # license-server-test), ubuntu'da. Sebep aşağıda.

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results
          path: ${{ github.workspace }}/TestResults/*.trx
          if-no-files-found: warn

  # Sunucu testleri — ubuntu, çünkü bir kısmı gerçek SQL Server container'ı
  # istiyor.
  #
  # Neden Windows işinden çıkarıldı: suite'in çoğu InMemory'de koşuyor ama
  # InMemory'de eşzamanlılık semantiği yok — aynı satıra iki eşzamanlı yazma
  # yarışmıyor. Refresh token rotasyonunun tek kullanımlık olduğunu ancak
  # gerçek bir veritabanına karşı kanıtlayabiliyoruz (bkz.
  # RefreshTokenConcurrencyTests). Testcontainers Linux container'ı açıyor;
  # windows-latest runner'ında bu çalışmaz.
  #
  # Filtre/etiketle ayırmak yerine işin tamamı buraya taşındı: etiket koymayı
  # unutan bir sonraki test yanlış runner'da patlardı. Ayrıca prod zaten
  # Linux — burada koşmak parite açısından da daha doğru.
  #
  # Proje net10.0 (WPF yok), o yüzden solution'a değil doğrudan csproj'a
  # kuruluyor.
  #
  # Parçalama (2026-10-25): tek iş ~36 dk sürüyordu. Kritik yol seri koşan
  # [Collection("sqlserver")] zinciriydi (her test yeni DB + bütün EF göçleri,
  # ~4 sn/test); InMemory testleriyle aynı runner'da CPU paylaşınca zincir ~2×
  # yavaşlıyordu (ölçüldü). Şimdi iki ayrı eksen var: ilişkisel testler
  # RELATIONAL_SHARDS, InMemory testleri INMEMORY_SHARDS parçaya bölünür (sayılar
  # changes işinde). Hangi vakanın hangi parçada koşacağını assembly kendisi
  # seçer (ORDERDECK_TEST_SHARD; TestHelpers/ShardingTestFramework.cs): kararlı
  # SHA-256 özeti, ilişkiselde metot, InMemory'de sınıf düzeyinde. Değişken
  # yoksa tam koşu — yerelde bir parçayı birebir üretmek için
  # `ORDERDECK_TEST_SHARD=relational:0/4 dotnet test ...`.
  #
  # Her parça kendi derlemesini yapar: ayrı bir build işi + artifact akışa seri
  # ~2 dk eklerdi; repo public, dakikalar ölçümsüz.
  license-server-shard:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-latest
    # Zaman aşımı geçmişi (tek iş dönemi): 25 dk sınırdaydı (master 2ae551a1,
    # 38406132099: test adımı 23 dk 26 sn; satış senkronu S1 ayrı bir Express
    # konteyneri ve iki kez 30 bin satırlık göç tohumu ekledi). 45 → 60
    # (2026-10-22): #533 38 dk, #534 42 dk. 60 → 90 (2026-10-24): #539'un test
    # DB silmesi kritik yola ~15 dk ekledi, master'da iki koşu 60. dakikada
    # kesildi, deploy atlandı ve geri alma (#540) prod'a çıkamadı; silme arka
    # plana alındı (SqlServerContainerFixture).
    # Parçalı dönemde bir parçanın beklenen süresi ~10 dk; 30 dk, beklenmedik bir
    # yavaşlığın deploy'u (bu iş akışının başarısına bağlı) kilitlememesi için
    # bol pay. Repo public: payın maliyeti yok.
    timeout-minutes: 30
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.changes.outputs.matrix) }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Cache NuGet packages
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: ~/.nuget/packages
          key: nuget-${{ runner.os }}-${{ hashFiles('**/*.csproj', 'global.json') }}
          restore-keys: |
            nuget-${{ runner.os }}-

      - name: Build (Release)
        run: >
          dotnet build OrderDeck.LicenseServer.Tests/OrderDeck.LicenseServer.Tests.csproj
          --configuration Release --nologo

      # Toplayıcının bağımsız denetimi: keşif süzülmez, yani bu liste
      # assembly'nin parça seçiminden bağımsız olarak bütün vakaları verir.
      # Tek parçada yeter.
      - name: Test listesi (eksiksizlik denetimi için)
        if: matrix.kind == 'inmemory' && matrix.index == 0
        run: |
          set -euo pipefail
          mkdir -p "$GITHUB_WORKSPACE/TestResults"
          dotnet test OrderDeck.LicenseServer.Tests/OrderDeck.LicenseServer.Tests.csproj \
            --configuration Release --no-build --nologo --list-tests \
            > "$GITHUB_WORKSPACE/TestResults/list-tests.txt"
          grep -c '^    ' "$GITHUB_WORKSPACE/TestResults/list-tests.txt"

      # Bu suite PARALEL koşar — `xUnit.ParallelizeTestCollections=false`
      # bilerek yok.
      #
      # Bayrak buraya 2d2b115'te gelmişti, ama gerekçesi bu projeye hiç ait
      # değildi: sızdıran şey `GiveawayBannerViewModelTests`'in WPF
      # DispatcherTimer'ıydı ve o sınıf OrderDeck.Tests'te. Bu proje net10.0,
      # tek referansı OrderDeck.LicenseServer — içinde WPF yok. (O sızıntı da
      # zaten sonradan düzeltildi, bkz. yukarıdaki OrderDeck.Tests yorumu.)
      # Bedeli ölçüldü: seri 1806 test ~14 dk sürüyordu, tek bir yavaş sınıf
      # olmadan — düz kuyruk, test başına ort. 0.45 sn.
      #
      # Paralellik yapıca güvenli, kural olarak korunmalı:
      #   - ApiFactory her fixture'a `Guid.NewGuid()` ile AYRI InMemory DB adı
      #     ve ayrı geçici backup kökü veriyor; sınıflar birbirinin verisini
      #     göremiyor. Paylaşılan sabit bir DB adı eklenirse bu bozulur.
      #   - Gerçek SQL Server isteyen testlerin hepsi tek
      #     [Collection("sqlserver")] içinde; kendi aralarında seri kalıyorlar
      #     ve container ilişkisel parça başına bir kez kalkıyor (her parça
      #     ayrı süreç, ayrı konteyner).
      # Doğrulama: bayrak kaldırıldıktan sonra yerelde 3 kez koşuldu,
      # 1808/1808, sıfır flake.
      #
      # EF Core günlüğü Warning'e süzülür: test sunucusu her SQL komutunu
      # Information düzeyinde yazıyordu ve konsol + trx günlüğü koşu başına
      # ~135 MB'a çıkmıştı (#533 ve #534'te runner "shutdown signal" ile
      # kapandı). Yerel ölçüm (SalesSyncEnableRelationalTests): çıktı 3,9 MB →
      # 11 KB, süre 3,4 → 2,5 dk. Uyarı ve hatalar yine görünür; ortam
      # değişkeni yalnız bu adımda, prod yapılandırmasına dokunmaz.
      #
      # ORDERDECK_TEST_SHARD_MANIFEST mutlak yol olmalı: testhost'un çalışma
      # dizini bin/ altı.
      - name: Test - OrderDeck.LicenseServer.Tests (${{ matrix.kind }} ${{ matrix.index }}/${{ matrix.count }})
        env:
          Logging__LogLevel__Microsoft.EntityFrameworkCore: Warning
          ORDERDECK_TEST_SHARD: ${{ matrix.kind }}:${{ matrix.index }}/${{ matrix.count }}
          ORDERDECK_TEST_SHARD_MANIFEST: ${{ github.workspace }}/TestResults/shard-${{ matrix.kind }}-${{ matrix.index }}.manifest
        run: >
          dotnet test OrderDeck.LicenseServer.Tests/OrderDeck.LicenseServer.Tests.csproj
          --configuration Release --no-build --nologo
          --logger "console;verbosity=normal"
          --logger "trx;LogFileName=license-server-${{ matrix.kind }}-${{ matrix.index }}.trx"
          --results-directory ${{ github.workspace }}/TestResults
          --blame-hang-timeout 5m

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: test-results-license-server-${{ matrix.kind }}-${{ matrix.index }}
          path: |
            ${{ github.workspace }}/TestResults/*.trx
            ${{ github.workspace }}/TestResults/*.manifest
            ${{ github.workspace }}/TestResults/list-tests.txt
          if-no-files-found: warn

  # Sunucu testlerinin TEK sonucu (adı tek-iş döneminden korunuyor). İleride
  # zorunlu check eklenirse bu ve build-test seçilmeli; matris işleri
  # (license-server-shard (...)) değil — atlandıklarında genişletilmeden
  # raporlanırlar.
  #
  # if: always() bilerek: parça düşse ya da koşu iptal edilse de bu iş koşar
  # ve kırmızı yanar; "skipped" zorunlu check açısından başarılı sayılırdı.
  #
  # Parçalar yeşil olsa bile koruma (.github/scripts/check-test-shards.py) her
  # vakanın TAM BİR parçada koştuğunu ve birleşimin --list-tests ile aynı
  # olduğunu doğrular; eksik ya da iki kez koşan test burada kırmızıdır.
  license-server-test:
    needs: [changes, license-server-shard]
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Parça sonuçları
        id: gate
        env:
          CHANGES: ${{ needs.changes.result }}
          CODE: ${{ needs.changes.outputs.code }}
          SHARDS: ${{ needs.license-server-shard.result }}
        run: |
          set -euo pipefail
          if [ "$CHANGES" != "success" ]; then
            echo "::error::changes işi '$CHANGES' bitti; testlerin koşup koşmadığı bilinmiyor."
            exit 1
          fi
          if [ "$CODE" != "true" ]; then
            echo "Sunucu kodu değişmedi (yalnız docs/web); sunucu testleri atlandı."
            echo "check=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "$SHARDS" != "success" ]; then
            echo "::error::En az bir sunucu test parçası başarısız ya da iptal: '$SHARDS'."
            exit 1
          fi
          echo "check=true" >> "$GITHUB_OUTPUT"

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        if: steps.gate.outputs.check == 'true'
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Parça çıktılarını indir
        if: steps.gate.outputs.check == 'true'
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          pattern: test-results-license-server-*
          merge-multiple: true
          path: ${{ runner.temp }}/shards

      - name: Eksiksizlik denetimi
        if: steps.gate.outputs.check == 'true'
        env:
          MATRIX: ${{ needs.changes.outputs.matrix }}
        run: python3 .github/scripts/check-test-shards.py --dir "$RUNNER_TEMP/shards" --matrix "$MATRIX"

  # Sunucu imajını PR'da DERLER, push ETMEZ.
  #
  # Neden ayrı bir iş: yukarıdaki build-test çözümün tamamını Windows'ta derliyor
  # ve Docker'a özel hiçbir şeyi sınamıyor. İmaj eskiden yalnız master'a push'ta
  # derleniyordu, yani Docker'a özgü her kırılma ilk kez PROD DEPLOY'unda ortaya
  # çıkıyordu — 2026-08-13'te tam bu oldu (PR #258 yeni bir ProjectReference
  # ekledi, Dockerfile'ın COPY listesi geri kaldı, restore projeyi sessizce atladı,
  # publish CS0234 ile patladı ve sunucu bir sürüm geride kaldı).
  #
  # Dockerfile artık `COPY . .` yaptığı için proje-grafiği ayrışması imkânsız
  # (bkz. #259); bu iş geriye kalanı yakalıyor: temel imaj sürümü, eksik native
  # bağımlılık, runtime katmanı hataları, .dockerignore'un yanlışlıkla gerekli bir
  # şeyi elemesi.
  #
  # Deploy iş akışı bu workflow'un SONUCUNA bağlı (workflow_run + conclusion ==
  # success), dolayısıyla bu iş kırmızıysa deploy da tetiklenmez.
  docker-build:
    needs: changes
    if: needs.changes.outputs.code == 'true'
    # Linux imajı; build-test'in windows-latest'ında derlenemez.
    runs-on: ubuntu-latest
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Build image (push yok)
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: OrderDeck.LicenseServer/Dockerfile
          push: false
          # Deploy iş akışıyla aynı gha önbelleğini okur; oradaki katmanlar
          # burada da işe yarar. mode=max ile YAZMIYOR: doğrulama koşusu
          # deploy'un önbelleğini kirletmesin.
          cache-from: type=gha
