name: release

# Sürüm tag'i (vX.Y.Z) push'lanınca Velopack release'ini üretir: Setup.exe +
# full/delta .nupkg + releases.win.json feed manifesti. Çıktı VPS'teki statik
# feed dizinine (orderdeckapp.com/downloads/velopack) yüklenir; kurulu app
# oradan delta güncelleme alır. Setup.exe ayrıca GitHub Release'e de eklenir.
#
# Kullanım: git tag v1.2.3 && git push origin v1.2.3
#
# Neden 3 job: WPF + vpk WINDOWS runner ister; ama windows runner VPS'e SSH
# atamıyor (bağlantı timeout — web-deploy gibi UBUNTU runner erişebiliyor).
# O yüzden VPS I/O (feed indir/yükle) ubuntu job'larında, build windows'ta.
#   feed-baseline (ubuntu) → build (windows) → publish (ubuntu)

on:
  push:
    tags: ["v*"]

# Varsayılan olarak hiçbir izin verme; her job yalnız ihtiyacı olanı ister
# (en az ayrıcalık). GitHub Release yazımı yalnız 'publish' job'ında gerekli.
permissions: {}

jobs:
  # ── 1) Delta için bir önceki yayınlanmış sürümü (nupkg + manifest) indir, artifact yap ──
  feed-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Yalnız .github/scripts için checkout (workflow düzeyi permissions: {}).
    permissions:
      contents: read
    outputs:
      # Seçilen tabanın sürümü; ilk sürümde boş. build işi tabanın gerçekten
      # geldiğini ve delta'nın bu sürüm için üretildiğini buna bakarak denetler.
      baseline_version: ${{ steps.pull.outputs.baseline_version }}
    env:
      # Feed boş görünüyorsa (paket yok, manifest yok) taban seçilemez ve sürüm
      # DURUR: onlarca sürümden sonra bu "ilk sürüm" değil, yanlış ya da
      # okunamayan klasördür ve sessizce deltasız sürüm çıkarırdı. Gerçekten
      # ilk sürümse (yeni bir feed) bunu bir PR ile 'true' yapın.
      ALLOW_NO_BASELINE: 'false'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # v0.6.0'da bu adım sessizce düştü: iki scp de TCP timeout'una girdi (her
      # biri ~133 sn), stderr `2>/dev/null` ile yutuldu ve `|| echo` "first
      # release" diyerek job'ı yeşil bıraktı. Sonuç: baseline yok → delta yok →
      # 0.5.0 kullanıcıları 102 MB'ın tamamını indirdi. Artık "feed boş" ile
      # "bağlanamadım" ayrı ele alınıyor: önce ucuz bir ssh ile feed'in durumu
      # okunuyor (3 deneme), bağlantı kurulamazsa release DURUYOR.
      #
      # v0.9.11–v0.9.13'te taban sessizce yanlış seçildi: adım feed klasöründe
      # değişiklik zamanı en yeni iki pakete bakıyordu (`ls -1t | head -n 2`),
      # publish taban paketlerini de yeniden yüklediği için en yeni zaman her
      # sürümden sonra 0.9.9'da kalıyordu. Üç sürümün delta'sı 0.9.9'a göre
      # üretildi ve hiçbir kurulumda uygulanamadı. Artık taban, istemcinin de
      # gördüğü manifestten SÜRÜM SIRASINA göre seçiliyor ve indirilen paket
      # manifestteki SHA256 ile doğrulanıyor; kurallar ve testleri
      # .github/scripts/delta-baseline.py'de.
      - name: Pull existing feed
        id: pull
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -uo pipefail
          VERSION="${GITHUB_REF_NAME#v}"
          mkdir -p baseline
          # Ara dosyalar baseline/ DIŞINDA: baseline/ artifact olur, build'de
          # Releases/ altına iner; oraya giren her şey feed'e yüklenebilir.
          WORK="$RUNNER_TEMP/delta-baseline"
          mkdir -p "$WORK"
          FEED=/opt/orderdeck/web-out/downloads/velopack
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          # Feed'in durumu tek satır: "<paket adedi> <manifest var mı: 0|1>".
          # Uzaktaki ls'in "dosya yok" çıkışı adedi 0 yapar; ssh'ın KENDİ çıkış
          # kodu (bağlantı hatası) korunur.
          ok=0
          for i in 1 2 3; do
            if STATE=$(ssh $SSHOPTS "$REMOTE" \
                         "n=\$(ls -1 ${FEED}/*.nupkg 2>/dev/null | wc -l); m=0; [ -f ${FEED}/releases.win.json ] && m=1; echo \"\$n \$m\""); then
              ok=1; break
            fi
            echo "::warning::VPS feed'i okunamadı (deneme $i/3)"
            sleep $((i * 20))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::VPS'e bağlanılamadı — delta üretilemez, release durduruldu. Re-run deneyin."
            exit 1
          fi
          read -r NUPKG_COUNT HAS_MANIFEST <<< "$(echo "$STATE" | tail -n 1)"
          if ! [[ "$NUPKG_COUNT" =~ ^[0-9]+$ && "$HAS_MANIFEST" =~ ^[01]$ ]]; then
            echo "::error::Feed durumu okunamadı (beklenmeyen çıktı) — release durduruldu."
            exit 1
          fi
          echo "Feed: $NUPKG_COUNT paket, manifest: $HAS_MANIFEST"

          MANIFEST_ARGS=()
          if [ "$HAS_MANIFEST" = "1" ]; then
            scp $SSHOPTS "${REMOTE}:${FEED}/releases.win.json" baseline/ \
              || { echo "::error::releases.win.json indirilemedi"; exit 1; }
            MANIFEST_ARGS=(--manifest baseline/releases.win.json)
          fi

          ALLOW_ARGS=()
          if [ "$ALLOW_NO_BASELINE" = "true" ]; then
            ALLOW_ARGS=(--allow-no-baseline)
          fi

          # stdout: indirilecek dosya adları (yalnız ALLOW_NO_BASELINE açıkken
          # ve feed boşken boş kalır); baseline_version çıktısını betik yazar.
          python3 .github/scripts/delta-baseline.py select \
            --version "$VERSION" --remote-nupkg-count "$NUPKG_COUNT" \
            "${MANIFEST_ARGS[@]}" "${ALLOW_ARGS[@]}" \
            --out "$WORK/secim.json" --github-output "$GITHUB_OUTPUT" > "$WORK/dosyalar.txt" \
            || { echo "::error::Delta tabanı seçilemedi — release durduruldu."; exit 1; }

          mapfile -t FILES < "$WORK/dosyalar.txt"
          if [ "${#FILES[@]}" -eq 0 ]; then
            echo "::notice::Feed boş ve ALLOW_NO_BASELINE açık — yalnız full paket üretilecek (ilk release)."
          fi
          for f in "${FILES[@]}"; do
            echo "Baseline indiriliyor: $f"
            scp $SSHOPTS "${REMOTE}:${FEED}/$f" baseline/ \
              || { echo "::error::$f indirilemedi"; exit 1; }
          done

          python3 .github/scripts/delta-baseline.py verify --selection "$WORK/secim.json" --dir baseline \
            || { echo "::error::İndirilen taban manifestle uyuşmuyor — release durduruldu."; exit 1; }
          ls -la baseline

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: feed-baseline
          path: baseline/
          if-no-files-found: ignore
          retention-days: 1

  # ── 2) Windows: publish + vpk pack (delta baseline varsa kullanır) ──
  build:
    needs: feed-baseline
    runs-on: windows-latest
    timeout-minutes: 40
    # Repo private: checkout'un GITHUB_TOKEN'ı contents:read olmadan
    # "Repository not found" ile patlar (workflow düzeyi permissions: {}).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@0f4a354dd5547a28c70b7853dbd95d5b67886e73 # v6.1.0
        with:
          global-json-file: global.json

      - name: Compute version (strip leading v)
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Gömülü YouTube kimlik bilgilerini build-time enjekte et (repo'da BOŞ).
      - name: Inject YouTube credentials
        shell: pwsh
        env:
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          $oauth = 'OrderDeck.Chat/YouTube/YouTubeOAuthDefaults.cs'
          $c = Get-Content $oauth -Raw
          $c = $c.Replace('public static readonly string ClientId = "";', 'public static readonly string ClientId = "' + $env:YT_OAUTH_CLIENT_ID + '";')
          $c = $c.Replace('public static readonly string ClientSecret = "";', 'public static readonly string ClientSecret = "' + $env:YT_OAUTH_CLIENT_SECRET + '";')
          Set-Content $oauth $c -NoNewline

          $api = 'OrderDeck.Chat/YouTube/YouTubeApiDefaults.cs'
          $a = Get-Content $api -Raw
          $a = $a.Replace('public static readonly string ApiKey = "";', 'public static readonly string ApiKey = "' + $env:YT_API_KEY + '";')
          Set-Content $api $a -NoNewline

          if ((Get-Content $oauth -Raw).Contains('ClientId = "";')) { throw 'YT_OAUTH_CLIENT_ID enjekte edilemedi (secret eksik?)' }
          if ((Get-Content $api -Raw).Contains('ApiKey = "";')) { throw 'YT_API_KEY enjekte edilemedi (secret eksik?)' }
          Write-Host 'YouTube credentials injected.'

      # Delta baseline'ı Releases/ altına al (vpk buradan delta üretir).
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: feed-baseline
          path: Releases
        continue-on-error: true

      # İlk release'te baseline yoktur (delta beklenmez). feed-baseline bir taban
      # seçtiyse o paket burada OLMAK ZORUNDA: yukarıdaki indirme
      # continue-on-error; artifact inmezse eskiden "baseline yok" sayılıp
      # sessizce deltasız sürüm çıkardı. Tersi de hata: taban bildirilmemişken
      # paket varsa çıktı bağlantısı kopmuştur ve aşağıdaki delta denetimi atlanır.
      # Tabandan BAŞKA tam paket de olmamalı: vpk delta'yı klasördeki en büyük
      # eski sürüme göre üretir ve delta paketi hangi tabana göre üretildiğini
      # taşımaz; tek aday kalınca taban kuşkuya yer bırakmaz.
      - name: Baseline durumu
        shell: bash
        env:
          BASELINE_VERSION: ${{ needs.feed-baseline.outputs.baseline_version }}
        run: |
          shopt -s nullglob
          pkgs=(Releases/*.nupkg)
          if [ -z "$BASELINE_VERSION" ]; then
            if [ "${#pkgs[@]}" -ne 0 ]; then
              echo "::error::feed-baseline taban bildirmedi ama Releases/ altında ${#pkgs[@]} paket var."
              exit 1
            fi
            echo "::warning::Baseline yok — delta üretilmeyecek, herkes tam paketi indirir."
            exit 0
          fi
          full="Releases/OrderDeck-${BASELINE_VERSION}-full.nupkg"
          if [ ! -f "$full" ]; then
            echo "::error::Taban paketi yok: $full (feed-baseline artifact'i inmedi?). Deltasız sürüm çıkmasın diye duruldu; bu işi yeniden çalıştırın, artifact'in süresi dolduysa (1 gün) tüm işleri."
            exit 1
          fi
          for other in Releases/*-full.nupkg; do
            if [ "$other" != "$full" ]; then
              echo "::error::Releases/ altında tabandan (${BASELINE_VERSION}) başka tam paket var: $other — vpk delta'yı ona göre üretebilir."
              exit 1
            fi
          done
          echo "Delta tabanı: ${BASELINE_VERSION}"
          ls -la "${pkgs[@]}"

      - name: Build Velopack release
        shell: pwsh
        run: installer\build.ps1 -Version ${{ steps.ver.outputs.version }}

      # Sessiz bozulmaya karşı son bariyer: taban vardıysa BU SÜRÜMÜN delta'sı
      # da çıkmalı. (Eski denetim `*delta*` arıyordu; taban kendi delta'sıyla
      # geldiği için yeni delta üretilmese de geçiyordu.)
      - name: Delta üretildi mi
        if: needs.feed-baseline.outputs.baseline_version != ''
        shell: bash
        env:
          VERSION: ${{ steps.ver.outputs.version }}
          BASELINE_VERSION: ${{ needs.feed-baseline.outputs.baseline_version }}
        run: |
          delta="Releases/OrderDeck-${VERSION}-delta.nupkg"
          if [ ! -f "$delta" ]; then
            echo "::error::Taban (${BASELINE_VERSION}) vardı ama bu sürümün delta paketi üretilmedi: $delta"
            exit 1
          fi
          echo "Delta: ${BASELINE_VERSION} -> ${VERSION}"
          ls -la "$delta"

      # Portable.zip feed'e gerekmiyor (~97 MB) — artifact'e koyma.
      - name: Trim artifact
        shell: bash
        run: rm -f Releases/*Portable*.zip

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-out
          path: Releases/
          retention-days: 1
    outputs:
      version: ${{ steps.ver.outputs.version }}

  # ── 3) Ubuntu: feed'i VPS'e yükle + GitHub Release'e Setup.exe ──
  publish:
    # feed-baseline: yayın öncesi denetim, seçilen tabanı onun çıktısından okur.
    needs: [feed-baseline, build]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release oluşturmak için (yalnız bu job)
    steps:
      # .github/scripts (yayın öncesi feed denetimi). Artifact'ten ÖNCE:
      # checkout çalışma klasörünü temizler.
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/scripts

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-out
          path: Releases

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # Yalnız BU sürümün paketleri yüklenir. Releases/ altında taban paketleri
      # de durur (delta onlardan üretildi) ama sunucuda zaten varlar; yeniden
      # yüklemek hem ~130 MB boşa gider hem de değişiklik zamanlarını yeniler
      # (v0.9.11–v0.9.13'teki yanlış tabanın kaynağı buydu). Manifest EN SON
      # gider: istemci, paketleri henüz yüklenmemiş bir sürümü görmesin.
      #
      # Yüklemeden hemen önce feed yeniden okunur: taban seçildikten sonra feed
      # değiştiyse (üst üste atılan iki etiket aynı manifesti okur; eski bir
      # koşuda yalnız bu iş yeniden çalıştırılırsa feed-baseline yeniden koşmaz)
      # delta yanlış tabana göredir ya da feed geri gider. İkisi de yeşil
      # biterdi; artık feed'e dokunmadan duruyor. Kalan pencere yüklemenin
      # süresi kadardır (yaklaşık bir dakika).
      - name: Upload feed to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          VERSION: ${{ needs.build.outputs.version }}
          BASELINE_VERSION: ${{ needs.feed-baseline.outputs.baseline_version }}
        run: |
          set -uo pipefail
          FEED=/opt/orderdeck/web-out/downloads/velopack
          REMOTE="${DEPLOY_USER}@${DEPLOY_HOST}"
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new"

          FULL="Releases/OrderDeck-${VERSION}-full.nupkg"
          DELTA="Releases/OrderDeck-${VERSION}-delta.nupkg"
          MANIFEST="Releases/releases.win.json"
          for f in "$FULL" "$MANIFEST" Releases/OrderDeck-win-Setup.exe; do
            if [ ! -f "$f" ]; then
              echo "::error::Yüklenecek dosya yok: $f — feed'e dokunulmadı."
              exit 1
            fi
          done

          # Sunucudaki güncel manifest (yoksa boş çıktı; ssh'ın kendi çıkış
          # kodu bağlantı hatasını gösterir).
          WORK="$RUNNER_TEMP/delta-baseline"
          mkdir -p "$WORK"
          if ! ssh $SSHOPTS "$REMOTE" "cat ${FEED}/releases.win.json 2>/dev/null || true" > "$WORK/sunucu.json"; then
            echo "::error::Feed okunamadı — feed'e dokunulmadı. Bu işi yeniden çalıştırın."
            exit 1
          fi
          NOW_ARGS=()
          if [ -s "$WORK/sunucu.json" ]; then
            NOW_ARGS=(--manifest "$WORK/sunucu.json")
          fi
          python3 .github/scripts/delta-baseline.py recheck \
            --version "$VERSION" --expect-baseline "$BASELINE_VERSION" "${NOW_ARGS[@]}" \
            || { echo "::error::Feed'e dokunulmadı."; exit 1; }

          upload=()
          for f in Releases/*; do
            case "$f" in
              "$MANIFEST") ;;
              "$FULL"|"$DELTA") upload+=("$f") ;;
              *.nupkg) echo "Atlandı (taban paketi, sunucuda var): $f" ;;
              *) upload+=("$f") ;;
            esac
          done
          printf 'Yüklenecek: %s\n' "${upload[@]}" "$MANIFEST (en son)"

          ssh $SSHOPTS "$REMOTE" "mkdir -p ${FEED}"
          scp $SSHOPTS "${upload[@]}" "${REMOTE}:${FEED}/"
          scp $SSHOPTS "$MANIFEST" "${REMOTE}:${FEED}/"

      - name: Create GitHub Release + upload Setup.exe
        uses: softprops/action-gh-release@8a0cd651e5b2365bd640854a3fa5dfc70e4875f3 # v3.0.4
        with:
          name: OrderDeck ${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: Releases/OrderDeck-win-Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
