name: release

# Sürüm tag'i (vX.Y.Z) push'lanınca Velopack release'ini üretir: Setup.exe +
# full/delta .nupkg + releases.win.json feed manifesti. Çıktı VPS'teki statik
# feed dizinine (orderdeckapp.com/downloads/velopack) yüklenir; kurulu app
# oradan delta güncelleme alır. Setup.exe ayrıca GitHub Release'e de eklenir.
#
# Kullanım: git tag v1.2.3 && git push origin v1.2.3
#
# Neden 3 job: WPF + vpk WINDOWS runner ister; ama windows runner VPS'e SSH
# atamıyor (bağlantı timeout — web-deploy gibi UBUNTU runner erişebiliyor).
# O yüzden VPS I/O (feed indir/yükle) ubuntu job'larında, build windows'ta.
#   feed-baseline (ubuntu) → build (windows) → publish (ubuntu)

on:
  push:
    tags: ["v*"]

# Varsayılan olarak hiçbir izin verme; her job yalnız ihtiyacı olanı ister
# (en az ayrıcalık). GitHub Release yazımı yalnız 'publish' job'ında gerekli.
permissions: {}

jobs:
  # ── 1) Delta için mevcut feed'i (nupkg + manifest) indir, artifact yap ──
  feed-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Pull existing feed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          mkdir -p baseline
          FEED=/opt/orderdeck/web-out/downloads/velopack
          # İlk release'te dizin boş/olmayabilir → hataları yut (yalnız full üretilir).
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${FEED}/*.nupkg" baseline/ 2>/dev/null || echo "no prev nupkgs (first release)"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}:${FEED}/releases.win.json" baseline/ 2>/dev/null || echo "no prev manifest"
          ls -la baseline || true

      - uses: actions/upload-artifact@v4
        with:
          name: feed-baseline
          path: baseline/
          if-no-files-found: ignore
          retention-days: 1

  # ── 2) Windows: publish + vpk pack (delta baseline varsa kullanır) ──
  build:
    needs: feed-baseline
    runs-on: windows-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json

      - name: Compute version (strip leading v)
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Gömülü YouTube kimlik bilgilerini build-time enjekte et (repo'da BOŞ).
      - name: Inject YouTube credentials
        shell: pwsh
        env:
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          $oauth = 'OrderDeck.Chat/YouTube/YouTubeOAuthDefaults.cs'
          $c = Get-Content $oauth -Raw
          $c = $c.Replace('public static readonly string ClientId = "";', 'public static readonly string ClientId = "' + $env:YT_OAUTH_CLIENT_ID + '";')
          $c = $c.Replace('public static readonly string ClientSecret = "";', 'public static readonly string ClientSecret = "' + $env:YT_OAUTH_CLIENT_SECRET + '";')
          Set-Content $oauth $c -NoNewline

          $api = 'OrderDeck.Chat/YouTube/YouTubeApiDefaults.cs'
          $a = Get-Content $api -Raw
          $a = $a.Replace('public static readonly string ApiKey = "";', 'public static readonly string ApiKey = "' + $env:YT_API_KEY + '";')
          Set-Content $api $a -NoNewline

          if ((Get-Content $oauth -Raw).Contains('ClientId = "";')) { throw 'YT_OAUTH_CLIENT_ID enjekte edilemedi (secret eksik?)' }
          if ((Get-Content $api -Raw).Contains('ApiKey = "";')) { throw 'YT_API_KEY enjekte edilemedi (secret eksik?)' }
          Write-Host 'YouTube credentials injected.'

      # Delta baseline'ı Releases/ altına al (vpk buradan delta üretir).
      - uses: actions/download-artifact@v4
        with:
          name: feed-baseline
          path: Releases
        continue-on-error: true

      - name: Build Velopack release
        shell: pwsh
        run: installer\build.ps1 -Version ${{ steps.ver.outputs.version }}

      # Portable.zip feed'e gerekmiyor (~97 MB) — artifact'e koyma.
      - name: Trim artifact
        shell: bash
        run: rm -f Releases/*Portable*.zip

      - uses: actions/upload-artifact@v4
        with:
          name: release-out
          path: Releases/
          retention-days: 1
    outputs:
      version: ${{ steps.ver.outputs.version }}

  # ── 3) Ubuntu: feed'i VPS'e yükle + GitHub Release'e Setup.exe ──
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release oluşturmak için (yalnız bu job)
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: release-out
          path: Releases

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload feed to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          FEED=/opt/orderdeck/web-out/downloads/velopack
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${FEED}"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            Releases/* "${DEPLOY_USER}@${DEPLOY_HOST}:${FEED}/"

      - name: Create GitHub Release + upload Setup.exe
        # Tedarik zinciri: 3. parti action commit SHA'sına pinli (tag mutable).
        uses: softprops/action-gh-release@3bb12739c298aeb8a4eeaf626c5b8d85266b0e65 # v2
        with:
          name: OrderDeck ${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: Releases/OrderDeck-win-Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
