name: release

# Sürüm tag'i (vX.Y.Z) push'lanınca Velopack release'ini üretir: Setup.exe +
# full/delta .nupkg + releases.win.json feed manifesti. Çıktı VPS'teki statik
# feed dizinine (orderdeckapp.com/downloads/velopack) yüklenir; kurulu app
# oradan delta güncelleme alır. Setup.exe ayrıca GitHub Release'e de eklenir.
#
# Kullanım: git tag v1.2.3 && git push origin v1.2.3
#
# Neden 3 job: WPF + vpk WINDOWS runner ister; ama windows runner VPS'e SSH
# atamıyor (bağlantı timeout — web-deploy gibi UBUNTU runner erişebiliyor).
# O yüzden VPS I/O (feed indir/yükle) ubuntu job'larında, build windows'ta.
#   feed-baseline (ubuntu) → build (windows) → publish (ubuntu)

on:
  push:
    tags: ["v*"]

# Varsayılan olarak hiçbir izin verme; her job yalnız ihtiyacı olanı ister
# (en az ayrıcalık). GitHub Release yazımı yalnız 'publish' job'ında gerekli.
permissions: {}

jobs:
  # ── 1) Delta için mevcut feed'i (nupkg + manifest) indir, artifact yap ──
  feed-baseline:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      # v0.6.0'da bu adım sessizce düştü: iki scp de TCP timeout'una girdi (her
      # biri ~133 sn), stderr `2>/dev/null` ile yutuldu ve `|| echo` "first
      # release" diyerek job'ı yeşil bıraktı. Sonuç: baseline yok → delta yok →
      # 0.5.0 kullanıcıları 102 MB'ın tamamını indirdi. Artık "feed boş" ile
      # "bağlanamadım" ayrı ele alınıyor: önce ucuz bir ssh ile listeleniyor
      # (3 deneme), bağlantı kurulamazsa release DURUYOR.
      - name: Pull existing feed
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          set -uo pipefail
          mkdir -p baseline
          FEED=/opt/orderdeck/web-out/downloads/velopack
          SSHOPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=20"

          ok=0
          for i in 1 2 3; do
            # `|| true` uzaktaki ls'in "dosya yok" çıkışını yutar; ssh'ın KENDİ
            # çıkış kodu (bağlantı hatası) korunur.
            if LIST=$(ssh $SSHOPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
                        "ls -1t ${FEED}/*.nupkg 2>/dev/null || true"); then
              ok=1; break
            fi
            echo "::warning::VPS feed'i listelenemedi (deneme $i/3)"
            sleep $((i * 20))
          done
          if [ "$ok" -ne 1 ]; then
            echo "::error::VPS'e bağlanılamadı — delta üretilemez, release durduruldu. Re-run deneyin."
            exit 1
          fi

          if [ -z "$LIST" ]; then
            echo "::notice::Feed'de önceki sürüm yok — yalnız full paket üretilecek (ilk release)."
            exit 0
          fi

          # Delta yalnız önceki sürüm(ler)e göre üretiliyor; en yeni 2 full paket
          # yeter. `ls -1t` mtime'a göre sıralar — isim sıralaması 0.10.0'ı
          # 0.5.0'ın önüne atardı.
          for f in $(echo "$LIST" | head -n 2); do
            echo "Baseline indiriliyor: $f"
            scp $SSHOPTS "${DEPLOY_USER}@${DEPLOY_HOST}:$f" baseline/ \
              || { echo "::error::$f indirilemedi"; exit 1; }
          done
          scp $SSHOPTS "${DEPLOY_USER}@${DEPLOY_HOST}:${FEED}/releases.win.json" baseline/ \
            || echo "::warning::releases.win.json yok (manifest olmadan da delta üretilebilir)"
          ls -la baseline

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: feed-baseline
          path: baseline/
          if-no-files-found: ignore
          retention-days: 1

  # ── 2) Windows: publish + vpk pack (delta baseline varsa kullanır) ──
  build:
    needs: feed-baseline
    runs-on: windows-latest
    timeout-minutes: 40
    # Repo private: checkout'un GITHUB_TOKEN'ı contents:read olmadan
    # "Repository not found" ile patlar (workflow düzeyi permissions: {}).
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@a98b56852c35b8e3190ac28c8c2271da59106c68 # v6.0.0
        with:
          global-json-file: global.json

      - name: Compute version (strip leading v)
        id: ver
        shell: bash
        run: echo "version=${GITHUB_REF_NAME#v}" >> "$GITHUB_OUTPUT"

      # Gömülü YouTube kimlik bilgilerini build-time enjekte et (repo'da BOŞ).
      - name: Inject YouTube credentials
        shell: pwsh
        env:
          YT_OAUTH_CLIENT_ID: ${{ secrets.YT_OAUTH_CLIENT_ID }}
          YT_OAUTH_CLIENT_SECRET: ${{ secrets.YT_OAUTH_CLIENT_SECRET }}
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: |
          $oauth = 'OrderDeck.Chat/YouTube/YouTubeOAuthDefaults.cs'
          $c = Get-Content $oauth -Raw
          $c = $c.Replace('public static readonly string ClientId = "";', 'public static readonly string ClientId = "' + $env:YT_OAUTH_CLIENT_ID + '";')
          $c = $c.Replace('public static readonly string ClientSecret = "";', 'public static readonly string ClientSecret = "' + $env:YT_OAUTH_CLIENT_SECRET + '";')
          Set-Content $oauth $c -NoNewline

          $api = 'OrderDeck.Chat/YouTube/YouTubeApiDefaults.cs'
          $a = Get-Content $api -Raw
          $a = $a.Replace('public static readonly string ApiKey = "";', 'public static readonly string ApiKey = "' + $env:YT_API_KEY + '";')
          Set-Content $api $a -NoNewline

          if ((Get-Content $oauth -Raw).Contains('ClientId = "";')) { throw 'YT_OAUTH_CLIENT_ID enjekte edilemedi (secret eksik?)' }
          if ((Get-Content $api -Raw).Contains('ApiKey = "";')) { throw 'YT_API_KEY enjekte edilemedi (secret eksik?)' }
          Write-Host 'YouTube credentials injected.'

      # Delta baseline'ı Releases/ altına al (vpk buradan delta üretir).
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: feed-baseline
          path: Releases
        continue-on-error: true

      # İlk release'te baseline yoktur (delta beklenmez); varsa delta ZORUNLU.
      - name: Baseline durumu
        id: baseline
        shell: bash
        run: |
          n=$(ls Releases/*.nupkg 2>/dev/null | wc -l)
          echo "count=$n" >> "$GITHUB_OUTPUT"
          if [ "$n" -eq 0 ]; then
            echo "::warning::Baseline yok — delta üretilmeyecek, herkes tam paketi indirir."
          else
            echo "Baseline paket sayısı: $n"
          fi

      - name: Build Velopack release
        shell: pwsh
        run: installer\build.ps1 -Version ${{ steps.ver.outputs.version }}

      # Sessiz bozulmaya karşı son bariyer: baseline vardıysa delta da çıkmalı.
      - name: Delta üretildi mi
        if: steps.baseline.outputs.count != '0'
        shell: bash
        run: |
          ls Releases/*delta*.nupkg >/dev/null 2>&1 \
            || { echo "::error::Baseline vardı ama delta paketi üretilmedi."; exit 1; }
          ls -la Releases/*delta*.nupkg

      # Portable.zip feed'e gerekmiyor (~97 MB) — artifact'e koyma.
      - name: Trim artifact
        shell: bash
        run: rm -f Releases/*Portable*.zip

      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: release-out
          path: Releases/
          retention-days: 1
    outputs:
      version: ${{ steps.ver.outputs.version }}

  # ── 3) Ubuntu: feed'i VPS'e yükle + GitHub Release'e Setup.exe ──
  publish:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # GitHub Release oluşturmak için (yalnız bu job)
    steps:
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: release-out
          path: Releases

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Upload feed to VPS
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          FEED=/opt/orderdeck/web-out/downloads/velopack
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            "${DEPLOY_USER}@${DEPLOY_HOST}" "mkdir -p ${FEED}"
          scp -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            Releases/* "${DEPLOY_USER}@${DEPLOY_HOST}:${FEED}/"

      - name: Create GitHub Release + upload Setup.exe
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          name: OrderDeck ${{ needs.build.outputs.version }}
          tag_name: ${{ github.ref_name }}
          files: Releases/OrderDeck-win-Setup.exe
          draft: false
          prerelease: false
          generate_release_notes: true
