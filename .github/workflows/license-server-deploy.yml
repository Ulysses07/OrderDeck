name: license-server-deploy

# License-server CI deploy. Fires after build-test passes on master:
# build a Linux image (license-server is net10.0, no WPF), push to GHCR
# with `latest` + immutable `master-<sha>` tags, sync `deploy/docker-compose.yml`
# to the VPS, then update the VPS .env's LICENSE_SERVER_TAG to the new sha
# and `compose up -d`.
#
# `deploy/docker-compose.yml` is the source of truth for the live file since
# 2026-08-22 — hand edits under /opt/orderdeck will be overwritten on the next
# deploy. `.env` is NOT synced: it holds the secrets and stays VPS-only.
#
# Production routing pins to `master-<short-sha>` (immutable). `:latest`
# is pushed for ergonomic manual ops only — never read by VPS compose
# in normal operation, so a mutable-tag race cannot revert prod.
#
# Out-of-order protection: an ancestry check against the VPS-recorded
# `.deployed_sha` skips a deploy whose commit is an ancestor of the
# currently-deployed one. The concurrency block serializes runs but
# does NOT guarantee chronological commit order — two parallel master
# pushes can finish their build-test runs in reverse order. The guard
# catches that case before any image work, so we don't burn runner time
# or leave a stale `:latest` pointing at older code.
#
# Path filtering is implicit: the Dockerfile only copies OrderDeck.LicenseServer/
# (no ProjectReference to other projects), so commits that don't touch
# license-server produce a byte-identical image manifest. `docker compose
# pull` detects the unchanged digest and `up -d` is a no-op — effectively
# a free fast-path for unrelated master commits.
#
# Rollback (2026-08-22, denetim O-12): otomatik. Deploy adımı .env'e
# dokunmadan önce mevcut tag+sha'yı VPS'teki `.rollback` dosyasına yazar;
# smoke test düşerse `deploy/scripts/rollback-license-server.sh --apply`
# önceki sürüme döner ve runner /ready'yi yeniden yoklar. Geri alma da
# başarısız olursa iş kırmızı kalır — o zaman elle müdahale gerekir.
# Script'in kendisi her deploy'da VPS'e kopyalanıyor (compose gibi), yani
# "güvenlik ağı kurulu değildi" durumu oluşamaz; elle çalıştırmak için
# `/opt/orderdeck/scripts/rollback-license-server.sh --apply`.
# All sha tags are immutable; image prune retains 72h of history.

on:
  workflow_run:
    workflows: ["build-test"]
    types: [completed]
    branches: [master, main]
  workflow_dispatch:

concurrency:
  group: license-server-deploy
  cancel-in-progress: false

jobs:
  deploy:
    # Skip if upstream build-test failed; allow workflow_dispatch unconditionally.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.head_branch == 'master')
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write

    steps:
      - uses: actions/checkout@v4
        with:
          # workflow_run carries the upstream sha; workflow_dispatch falls back
          # to the dispatched ref's HEAD.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Full history needed for the out-of-order ordering guard
          # (`git merge-base --is-ancestor`).
          fetch-depth: 0
          # Yalnız okuma git işlemleri; token'ı git config'te saklama.
          persist-credentials: false

      - name: Compute image tags
        id: tags
        run: |
          SHA="${{ github.event.workflow_run.head_sha || github.sha }}"
          SHORT="${SHA:0:7}"
          echo "sha=${SHA}" >> $GITHUB_OUTPUT
          echo "short=${SHORT}" >> $GITHUB_OUTPUT
          echo "image=ghcr.io/ulysses07/orderdeck-license-server" >> $GITHUB_OUTPUT
          echo "tag=master-${SHORT}" >> $GITHUB_OUTPUT

      - name: Setup SSH
        env:
          DEPLOY_SSH_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
        run: |
          mkdir -p ~/.ssh
          echo "$DEPLOY_SSH_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          # ssh-keyscan non-fatal: bash -e altında host'a ulaşılamadığında
          # (GitHub runner ↔ VPS arası geçici network) tüm deploy'u patlatıyordu.
          # Sonraki SSH adımları zaten -o StrictHostKeyChecking=accept-new
          # kullanıyor (host key'i kendileri ekliyor), known_hosts pre-populate
          # redundant — başarısızlığı yutmak güvenli.
          ssh-keyscan -H "${{ secrets.DEPLOY_HOST }}" >> ~/.ssh/known_hosts 2>/dev/null || true

      - name: Ordering guard (skip ancestor deploys)
        # Two master commits whose build-test runs finish out of order can
        # otherwise let the older one win. Deploy is gated on an ancestry
        # check against the VPS-recorded `.deployed_sha`: if our sha is an
        # ancestor of the currently-deployed one, this is an out-of-order
        # tail and we skip — before image work, so we don't waste runner
        # minutes or leave `:latest` stale.
        id: ordering
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          NEW_SHA="${{ steps.tags.outputs.sha }}"
          # Bu adım sadece bir optimizasyon (out-of-order tail deploy atlama).
          # GitHub runner → VPS arası geçici SSH timeout'u tüm deploy'u
          # patlatmamalı: birkaç kez dene, kalıcı başarısızlıkta CURRENT boş
          # kalır → skip=false ile devam (asıl Deploy adımı zaten SSH gerektirir).
          CURRENT=""
          for attempt in 1 2 3; do
            if CURRENT=$(ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
                 -o ConnectTimeout=15 -o ServerAliveInterval=5 -o ServerAliveCountMax=2 \
                 "${DEPLOY_USER}@${DEPLOY_HOST}" \
                 'cat /opt/orderdeck/.deployed_sha 2>/dev/null || true'); then
              break
            fi
            echo "::warning::Ordering guard SSH attempt ${attempt}/3 failed; retrying..."
            CURRENT=""
            sleep $((attempt * 5))
          done
          if [ -n "$CURRENT" ] && [ "$CURRENT" != "$NEW_SHA" ]; then
            if git merge-base --is-ancestor "$NEW_SHA" "$CURRENT" 2>/dev/null; then
              echo "::warning::Skipping out-of-order deploy: $NEW_SHA is an ancestor of currently-deployed $CURRENT"
              echo "skip=true" >> $GITHUB_OUTPUT
              exit 0
            fi
          fi
          echo "skip=false" >> $GITHUB_OUTPUT

      - name: Set up Docker Buildx
        if: steps.ordering.outputs.skip != 'true'
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        if: steps.ordering.outputs.skip != 'true'
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        if: steps.ordering.outputs.skip != 'true'
        uses: docker/build-push-action@v5
        with:
          context: .
          file: OrderDeck.LicenseServer/Dockerfile
          push: true
          tags: |
            ${{ steps.tags.outputs.image }}:latest
            ${{ steps.tags.outputs.image }}:${{ steps.tags.outputs.tag }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Sync compose + scripts to VPS
        if: steps.ordering.outputs.skip != 'true'
        id: compose
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        # `deploy/docker-compose.yml` eskiden hiçbir yere kopyalanmıyordu: bu
        # workflow VPS'te yalnız `.env`'in LICENSE_SERVER_TAG satırını güncelleyip
        # `compose up` diyordu. Yani repo'daki dosya bir ŞABLONdu ve elle bakılan
        # canlı dosyadan sessizce ayrışmıştı — 2026-08-22'de ölçülen fark:
        # `Jwt__SecretKey` üretimde `:?` korumasızdı (eksik .env satırı imzalama
        # anahtarını boş stringe indirir), Sms/WhatsApp/BroadcastMedia sağlayıcıları
        # `:-log`/`:-stub`'a düşüyordu (sessizce hiçbir şey göndermeyen üretim) ve
        # PR #317'nin yükleme tavanı hiç uygulanmamıştı. deploy/README.md ise bu
        # korumaları yaşıyormuş gibi anlatıyordu.
        #
        # Artık repo dosyası tek kaynak. Bedeli açık: bozuk bir compose merge
        # edilirse prod'u düşürebilir. İki kalkan var —
        #   1. `config -q`: değişkenler .env ile çözülüyor mu, YAML geçerli mi;
        #      karşılanmayan bir `:?` burada patlar ve canlı dosyaya dokunulmaz.
        #   2. `.prev` yedeği: Deploy adımı kalıcı olarak başarısız olursa eski
        #      dosya geri konur.
        #   3. Compose geçerli AMA uygulamayı bozuyorsa `up -d` başarılı olur ve
        #      smoke test düşer; bu durumda `Rollback on smoke failure` adımı
        #      devreye girer (denetim O-12).
        #
        # Geri alma script'i de burada kopyalanıyor: Deploy adımından ÖNCE
        # çalışan tek uzak adım bu, yani güvenlik ağı her zaman kurulu ve taze.
        run: |
          SSH_OPTS="-i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=accept-new -o ConnectTimeout=15"

          scp $SSH_OPTS deploy/docker-compose.yml \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/orderdeck/docker-compose.yml.new"

          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" 'mkdir -p /opt/orderdeck/scripts'
          scp $SSH_OPTS deploy/scripts/rollback-license-server.sh \
            "${DEPLOY_USER}@${DEPLOY_HOST}:/opt/orderdeck/scripts/rollback-license-server.sh"
          ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'chmod +x /opt/orderdeck/scripts/rollback-license-server.sh'

          # İşaretçiler bilerek ortak ek almıyor: "UNCHANGED" içinde "CHANGED"
          # geçer ve `case` kalıbı yanlış dalı seçerdi.
          RESULT=$(ssh $SSH_OPTS "${DEPLOY_USER}@${DEPLOY_HOST}" "
            cd /opt/orderdeck || exit 1
            if ! docker compose -f docker-compose.yml.new config -q; then
              rm -f docker-compose.yml.new
              exit 1
            fi
            if cmp -s docker-compose.yml.new docker-compose.yml; then
              rm -f docker-compose.yml.new
              echo COMPOSE_SAME
              exit 0
            fi
            cp docker-compose.yml docker-compose.yml.prev || exit 1
            mv docker-compose.yml.new docker-compose.yml || exit 1
            echo COMPOSE_CHANGED" 2>&1) || true

          echo "$RESULT"
          case "$RESULT" in
            *COMPOSE_CHANGED*) echo "changed=true"  >> $GITHUB_OUTPUT ;;
            *COMPOSE_SAME*)    echo "changed=false" >> $GITHUB_OUTPUT ;;
            *)
              echo "::error::compose doğrulaması başarısız — canlı dosyaya dokunulmadı"
              exit 1
              ;;
          esac

      - name: Deploy to VPS
        if: steps.ordering.outputs.skip != 'true'
        id: deploy
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          NEW_TAG: ${{ steps.tags.outputs.tag }}
          NEW_SHA: ${{ steps.tags.outputs.sha }}
          COMPOSE_CHANGED: ${{ steps.compose.outputs.changed }}
          # GHCR package PRIVATE — VPS pull için kimlik gerekiyor. Runner'ın
          # otomatik GITHUB_TOKEN'ı (packages:write yetkili) her run'da taze;
          # VPS'te bununla login olunca PAT/secret/expire derdi olmadan private
          # image çekilir. Token run-scoped → deploy sonunda logout edilir.
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # The VPS .env's LICENSE_SERVER_TAG is the source of truth for which
          # image runs in production. We pin to `master-<short-sha>` (immutable)
          # rather than `:latest` (mutable, racy under concurrent deploys).
          # `.deployed_sha` records the full sha so the next workflow run can
          # do its ancestry check.
          #
          # Retry: runner→VPS arası geçici SSH connect timeout'u deploy'u
          # patlatmasın (ordering guard ile aynı flake). Uzaktaki komut
          # idempotent (sed/echo/docker compose up/prune) → tekrar güvenli.
          #
          # `--capture` .env'e DOKUNULMADAN önce koşar: mevcut LICENSE_SERVER_TAG
          # ve .deployed_sha `.rollback`'a yazılır. Retry'a karşı korumalı —
          # script aynı run-id için dosya varsa üzerine yazmaz, yoksa ikinci
          # deneme "önceki sürüm" diye YENİ etiketi kaydeder ve geri alma bozuk
          # imaja dönerdi. Argümanlar runner'da genişliyor (kaçış tuzağı yok).
          #
          # Kapsam compose değişip değişmediğine bağlı. Compose aynıysa davranış
          # eskisiyle birebir: yalnız license-server. Değiştiyse dosyanın TAMAMI
          # uygulanmalı — `up -d license-server` caddy/sqlserver tanımındaki bir
          # değişikliği sessizce yutardı, ki bu tam da bu PR'ın kapattığı hata
          # sınıfı. Compose bildirimsel olduğu için tanımı değişmeyen konteynere
          # dokunulmaz; sqlserver ancak gerçekten düzenlenirse yeniden yaratılır.
          if [ "${COMPOSE_CHANGED}" = "true" ]; then
            UP_CMD="docker compose up -d"
          else
            UP_CMD="docker compose up -d license-server"
          fi

          deploy_remote() {
            ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
              -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
              "${DEPLOY_USER}@${DEPLOY_HOST}" \
              "set -e
               cd /opt/orderdeck
               echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_ACTOR}' --password-stdin
               scripts/rollback-license-server.sh --capture --run-id '${GITHUB_RUN_ID}' --compose-changed '${COMPOSE_CHANGED}'
               if grep -q '^LICENSE_SERVER_TAG=' .env; then
                 sed -i.bak 's|^LICENSE_SERVER_TAG=.*|LICENSE_SERVER_TAG=${NEW_TAG}|' .env
               else
                 echo 'LICENSE_SERVER_TAG=${NEW_TAG}' >> .env
               fi
               docker compose pull license-server
               ${UP_CMD}
               echo '${NEW_SHA}' > .deployed_sha
               docker image prune -f --filter 'until=72h' >/dev/null
               docker logout ghcr.io >/dev/null 2>&1 || true"
          }
          for attempt in 1 2 3; do
            if deploy_remote; then
              echo "Deploy succeeded (attempt ${attempt})"
              exit 0
            fi
            echo "::warning::Deploy SSH attempt ${attempt}/3 failed; retrying..."
            sleep $((attempt * 10))
          done
          echo "::error::Deploy failed after 3 attempts"

          # Kayıtlı duruma dön: hem compose'u hem LICENSE_SERVER_TAG'i. (Eskiden
          # burada yalnız compose geri konurdu; .env sed'i ilk denemede geçip
          # sonrası düştüğünde etiket yeni sürümde kalıyordu.) En iyi çaba —
          # başarısız olursa asıl hatayı gölgelemesin diye `|| true`.
          echo "::warning::geri alma deneniyor (.rollback)"
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "cd /opt/orderdeck && scripts/rollback-license-server.sh --apply --run-id '${GITHUB_RUN_ID}'" || true
          exit 1

      - name: Smoke test
        if: steps.ordering.outputs.skip != 'true'
        id: smoke
        run: |
          # /healthz DEĞİL /ready: /healthz sıfır kontrol koşturur (Predicate =>
          # false), yani süreç ayakta olduğu sürece 200 döner. Veritabanına hiç
          # bağlanamayan, EF migration'ı yarıda kalmış bir konteyner de smoke
          # testini geçerdi — dağıtım yeşil görünür, ilk gerçek istek patlardı.
          # /ready "ready" etiketli kontrolleri (DbContext) koşturur.
          #
          # license-server start time on this VPS is ~10s cold, longer on EF
          # migration. Poll up to 60s.
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/ready.out -w "%{http_code}" -m 5 \
                   https://license.orderdeckapp.com/ready || echo "000")
            if [ "$code" = "200" ]; then
              echo "Ready after ${i} attempt(s)"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/ready failed to return 200 within 60s (last=${code})"
          # Gövde hangi kontrolün düştüğünü söyler; log'a yazmazsak VPS'e
          # girmeden teşhis edilemez.
          cat /tmp/ready.out 2>/dev/null || true
          exit 1

      - name: Rollback on smoke failure
        # Denetim O-12. Deploy'un KENDİSİ başarılıysa ama uygulama gelmiyorsa
        # (geçerli compose + ayağa kalkan ama bozuk imaj) buraya düşülür.
        # Deploy başarısız olduğunda geri almayı o adım kendi içinde yaptı;
        # burada tekrar denemek `.rollback` silinmiş olduğu için gürültü olurdu.
        if: >-
          always() && steps.deploy.outcome == 'success' &&
          steps.smoke.outcome == 'failure'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
          GHCR_ACTOR: ${{ github.actor }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "::warning::smoke düştü — önceki sürüme dönülüyor"

          # Login gerekli: eski imaj büyük ihtimalle yerelde (prune 72h tutuyor)
          # ama 72 saatten eski bir sürüme dönüyorsak pull şart ve GHCR paketi
          # private.
          # `|| rc=$?`: adım `bash -e` ile koşuyor, çıplak bir ssh düşerse burada
          # kesilir ve logout ile aşağıdaki teşhis hiç çalışmaz.
          rc=0
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 -o ServerAliveInterval=10 -o ServerAliveCountMax=3 \
            "${DEPLOY_USER}@${DEPLOY_HOST}" \
            "set -e
             cd /opt/orderdeck
             echo '${GHCR_TOKEN}' | docker login ghcr.io -u '${GHCR_ACTOR}' --password-stdin
             scripts/rollback-license-server.sh --apply --run-id '${GITHUB_RUN_ID}'" || rc=$?

          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'docker logout ghcr.io >/dev/null 2>&1 || true' || true

          if [ "$rc" -ne 0 ]; then
            echo "::error::GERİ ALMA BAŞARISIZ — prod bozuk olabilir, elle müdahale gerek"
            exit 1
          fi

          # Konteynerin 'running' olması yetmez: smoke'u düşüren şey zaten ayağa
          # kalkan ama /ready vermeyen bir sürümdü. Uçtan tekrar doğrula.
          for i in $(seq 1 30); do
            code=$(curl -s -o /tmp/ready-rb.out -w "%{http_code}" -m 5 \
                   https://license.orderdeckapp.com/ready || echo "000")
            if [ "$code" = "200" ]; then
              echo "::warning::geri alma başarılı — prod önceki sürümde ayakta"
              # İş yine de kırmızı kalmalı: master'da bozuk bir commit var.
              exit 1
            fi
            sleep 2
          done
          echo "::error::geri alma sonrası /ready hâlâ 200 değil (last=${code}) — ELLE MÜDAHALE"
          cat /tmp/ready-rb.out 2>/dev/null || true
          exit 1

      - name: Finalize rollback state
        # Başarılı deploy sonrası `.rollback` ve `docker-compose.yml.prev` silinir.
        # Kalırsa sonraki bir koşunun geri alma dalı bayat dosyayı canlıya koyardı.
        if: >-
          steps.ordering.outputs.skip != 'true' &&
          steps.deploy.outcome == 'success' && steps.smoke.outcome == 'success'
        env:
          DEPLOY_HOST: ${{ secrets.DEPLOY_HOST }}
          DEPLOY_USER: ${{ secrets.DEPLOY_USER }}
        run: |
          ssh -i ~/.ssh/deploy_key -o StrictHostKeyChecking=accept-new \
            -o ConnectTimeout=15 "${DEPLOY_USER}@${DEPLOY_HOST}" \
            'cd /opt/orderdeck && scripts/rollback-license-server.sh --clear' || \
            echo "::warning::rollback durumu temizlenemedi (sonraki deploy üzerine yazar)"
