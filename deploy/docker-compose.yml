services:

  sqlserver:
    # Digest'e pinli (denetim O-14). `2022-latest` KAYAN bir etiket: 2026-08-22'de
    # ölçüldüğünde üretimde `sha256:2dca9ee5…` (16.0.4250.1, RTM-CU24-GDR)
    # koşuyordu ama etiket çoktan `sha256:ba4c8329…`'a taşınmıştı. Yani bu satır
    # etiketle kalsaydı, host'u yeniden kuran biri (HA-PLAYBOOK devir senaryosu)
    # üretimdekinden BAŞKA bir SQL Server derlemesi ayağa kaldırırdı.
    #
    # Bu tek başına "yeni sürüm gelir" meselesi değil: yeni bir CU veri
    # dosyalarını yükseltir ve o yükseltme GERİ ALINAMAZ — eski imaja dönmek
    # veritabanını açamaz hâle gelir. Deploy'un otomatik geri alması (#321)
    # imajı kurtarır, dosya formatını kurtarmaz.
    #
    # Digest ÜRETİMDE ÇALIŞANI gösteriyor, `2022-latest`'in bugünkü hâlini değil:
    # pinleme ile sürüm yükseltmesi ayrı kararlar. CU yükseltmesi ayrıca
    # yapılmalı — önce yedek, sonra bilinçli bir pencerede.
    # Etiket kısmı yalnız okunabilirlik için; docker digest'i kullanır.
    image: mcr.microsoft.com/mssql/server:2022-latest@sha256:2dca9ee5cd5316952d9b6ef4a0c088ac95b55e3502accdda0fc12ad6ede7b905
    container_name: orderdeck-sqlserver
    restart: unless-stopped
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_PASSWORD}
      MSSQL_PID: Express
    volumes:
      - ./sql-data:/var/opt/mssql
    networks:
      - web
    # Denetim O-11 bu servisi "root koşuyor" diye işaretlemişti; 2026-08-23'te
    # üretimde ölçüldü: zaten uid 10001 (mssql). Bilerek başka sertleştirme
    # eklenmedi — veri katmanında marjinal kazanç için risk alınmıyor;
    # `sa` → en az yetkili login işi ayrı bir faz (O-11 Faz 3).
    expose:
      - "1433"
    # SQL Express has a hard 1410 MB process memory cap — keep a comfortable margin
    # so a runaway query can't squeeze the host.
    mem_limit: 2g
    memswap_limit: 2g
    cpus: 1.0
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -Q 'SELECT 1' -C -No || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 20
      start_period: 60s

  license-server:
    # Image is built + pushed by .github/workflows/license-server-deploy.yml on
    # every successful build-test run for master. Pin a specific revision via
    # LICENSE_SERVER_TAG=master-<sha> in /opt/orderdeck/.env when rolling back.
    image: ghcr.io/ulysses07/orderdeck-license-server:${LICENSE_SERVER_TAG:-latest}
    container_name: orderdeck-license
    restart: unless-stopped
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ASPNETCORE_URLS: "http://+:8080"
      # Denetim O-11 Faz 3a: uygulama artık `sa` ile bağlanmıyor. `orderdeck_app`
      # yalnız OrderDeckLicense üzerinde `db_owner`; sunucu düzeyinde hiçbir
      # yetkisi yok (login yaratamaz, sp_configure/xp_cmdshell açamaz, msdb'yi
      # okuyamaz — üretimde negatif testle doğrulandı). `sa` sysadmin olduğu için
      # konteynerde kod çalıştıran biri instance'ın TAMAMINI devralabiliyordu.
      #
      # `db_owner` bilerek: uygulama açılışta `Migrate()` ve Hangfire
      # `PrepareSchemaIfNecessary` çalıştırıyor, ikisi de DDL istiyor.
      # Gerekçenin tamamı `deploy/setup-app-sql-login.sh` başında.
      #
      # `:?` bilinçli: `.env` CI tarafından senkronize EDİLMEZ. Değişken boşsa
      # compose'un kendisi durur ve bu, CI'ın `docker compose config -q` ön
      # kapısında — yani prod'a hiç dokunulmadan — patlar.
      #
      # `sa` ortadan kalkmadı: healthcheck, gecelik yedek cron'u, bootstrap-admin
      # ve smoke-jwt-refresh host tarafında root koşan operatör aletleri; onlar
      # `sa`'da kalıyor. Değişen tek şey internete bakan process.
      ConnectionStrings__LicenseDb: "Server=sqlserver,1433;Database=OrderDeckLicense;User=orderdeck_app;Password=${APP_SQL_PASSWORD:?deploy/setup-app-sql-login.sh ile uretilip .env e yazilmali};TrustServerCertificate=True;Encrypt=True;"
      # HA: read-only replica connection (SQL Server AlwaysOn secondary, or a
      # separate read-only login routed there). Empty = read paths fall back
      # to the primary, which keeps single-VPS deployments unchanged.
      ConnectionStrings__LicenseDbReadOnly: "${SQL_READ_REPLICA_CONN:-}"
      # `:?` olmadan, .env'de JWT_SECRET yoksa compose buraya BOŞ STRING
      # koyar ve o boş değer appsettings.json'daki anahtarı da ezer — yani
      # imzalama anahtarı sessizce yok olur. Kök (dev) compose dosyası bu
      # korumaya zaten sahipti, üretime bakan bu dosya değildi.
      # Sunucu tarafındaki ikinci savunma JwtOptionsValidator.
      Jwt__SecretKey: "${JWT_SECRET:?compose dosyasinin yanindaki .env icinde ayarla (bkz. deploy/README.md)}"
      Jwt__Issuer: "orderdeck-license-server"
      App__PublicBaseUrl: "https://orderdeckapp.com"
      Smtp__Host: "${SMTP_HOST:-smtp.example.com}"
      Smtp__Port: "${SMTP_PORT:-587}"
      Smtp__UseSsl: "${SMTP_USESSL:-true}"
      Smtp__Username: "${SMTP_USERNAME:-}"
      Smtp__Password: "${SMTP_PASSWORD:-}"
      Smtp__FromAddress: "${SMTP_FROM:-noreply@orderdeckapp.com}"
      Smtp__FromName: "OrderDeck"
      # SMS (shopper parola sıfırlama OTP). "netgsm" = gerçek gönderim, "log" =
      # sadece log'a yaz (dev). Netgsm__* boşsa provider netgsm olsa bile
      # gönderim reddedilir — .env'de doldur.
      #
      # `:-log` DEĞİL `:?`: eksik bir .env satırı yüzünden üretime sessizce
      # "hiçbir şey göndermeyen" sağlayıcıyla çıkmak, açılmayan bir konteynerden
      # çok daha pahalı — kayıp ancak müşteri "kod gelmedi" dediğinde fark
      # edilir. Sunucu tarafındaki ikinci savunma ProviderName.ResolveLive.
      Sms__Provider: "${SMS_PROVIDER:?compose dosyasinin yanindaki .env icinde ayarla: netgsm (bkz. deploy/README.md)}"
      Netgsm__UserCode: "${NETGSM_USERCODE:-}"
      Netgsm__Password: "${NETGSM_PASSWORD:-}"
      Netgsm__Header: "${NETGSM_HEADER:-}"
      # OTP = ticari olmayan bilgilendirme → İYS filtresi "0".
      Netgsm__IysFilter: "${NETGSM_IYSFILTER:-0}"
      # In-app update prompt — UpdateChecker bu iki değeri okuyup mevcut
      # sürümle karşılaştırır; LatestVersion boşsa kontrol atlanır (yanlış
      # pozitif yok). Bump akışı: yeni release tag → /opt/orderdeck/.env'e
      # AppRelease__LatestVersion=X.Y.Z + docker compose up -d --force-recreate.
      AppRelease__LatestVersion: "${AppRelease__LatestVersion:-}"
      AppRelease__DownloadUrl: "${AppRelease__DownloadUrl:-https://orderdeckapp.com/indir}"
      # Intake formu YouTube handle doğrulama (channels.list?forHandle). Boşsa
      # form doğrulamayı sessizce atlar (yumuşak degrade). VPS .env: YouTube__ApiKey.
      YouTube__ApiKey: "${YouTube__ApiKey:-}"
      Admin__InitialUsername: "${ADMIN_USERNAME:-admin}"
      Admin__InitialPasswordHash: "${ADMIN_PASSWORD_HASH}"
      # Recipient for ops alerts (backup restore drill failures, etc.). Empty
      # means log-only — see BackupRestoreDrillJob and HA-PLAYBOOK §monitoring.
      Admin__AlertEmail: "${Admin__AlertEmail:-}"
      Backup__MasterKeyHex: "${BACKUP_MASTER_KEY:-}"
      # Phase 5b — key ring. Add ${BACKUP_MASTERKEYS_1}, _2, ... as you rotate.
      # ASP.NET Core binds Backup__MasterKeys__1 → Dictionary<int,string> entry [1].
      Backup__MasterKeys__0: "${BACKUP_MASTERKEYS_0:-}"
      Backup__MasterKeys__1: "${BACKUP_MASTERKEYS_1:-}"
      Backup__MasterKeys__2: "${BACKUP_MASTERKEYS_2:-}"
      Backup__ActiveKeyVersion: "${BACKUP_ACTIVEKEYVERSION:-0}"
      Backup__StorageRoot: "/app/Backups"
      # DataProtection anahtar halkası — YOLU AÇIKÇA VERİLMEK ZORUNDA.
      # Boş bırakılırsa uygulama `$HOME/.aspnet/DataProtection-Keys`'e döner ve
      # konteyner artık root koşmadığı için $HOME değişmiştir: uygulama boş bir
      # dizin bulup KENDİNE YENİ ANAHTAR ÜRETİR, açılış başarılı olur ve
      # WhatsAppAccounts'taki şifreli token/PIN sessizce çözülemez hâle gelir.
      # Ayrıntı: Program.cs'teki DataProtection bloğu.
      DataProtection__KeysPath: "/app/keys"
      # Bu üçlü BİRLİKTE okunmalı; aşağıdaki mem_limit ile aynı bütçeyi
      # paylaşıyorlar. Yükleme yolu blob'u akıtmıyor, topluyor: istek başına
      # elde düz metin + zarf, yani ~2 × blob duruyor. Tepe bellek dolayısıyla
      # MaxBlobSizeMb × 2 × MaxConcurrentUploads ≈ 256 MB. Birini büyütürken
      # diğerlerine bakmadan yapma.
      #
      # Eskiden burada 200 yazıyordu ve bu sayı HİÇBİR ŞEY YAPMIYORDU: sunucunun
      # varsayılan istek gövdesi tavanı (30.000.000 bayt) daha önce devreye
      # giriyordu. Artık tavan istek başına uygulanıyor, yani buradaki değer
      # gerçekten bağlayıcı — 200 bırakmak 800 MB'lık tek istek demek olurdu.
      Backup__MaxBlobSizeMb: "64"
      Backup__MaxConcurrentUploads: "2"
      Backup__UploadQueueWaitSeconds: "10"
      # Backup__S3__* kaldırıldı: saha dışı kopyalama artık uygulamada değil,
      # VPS'te gecelik cron ile (deploy/scripts/backup-blobs-to-r2.sh).
      Cors__AllowedOrigins: "${CORS_ALLOWED_ORIGINS:-}"
      # Push (PR #56, 2026-05-15) — FCM. Sağlayıcıyı "stub" yaparsan gerçek
      # bildirim gitmez. JSON anahtar dosyası host'tan read-only mount edilir
      # (aşağıdaki volumes), repoda tutulmaz.
      OrderDeck__Push__Provider: "${OrderDeck__Push__Provider:-fcm}"
      OrderDeck__Push__Fcm__ServiceAccountJsonPath: "/etc/orderdeck/firebase-service-account.json"
      # Broadcast posts (Spec 2, 2026-05-19) — Cloudflare R2 medya deposu.
      # Provider "stub" = bellekte tut (dev), "r2" = gerçek depo. Stub üretimde
      # en pahalı sessiz arıza: yüklenen medya ve müşteri dekontları hiçbir yere
      # yazılmaz ama yükleme başarılı döner. Bu yüzden `:-stub` değil `:?`.
      OrderDeck__BroadcastMedia__Provider: "${OrderDeck__BroadcastMedia__Provider:?compose dosyasinin yanindaki .env icinde ayarla: r2 (bkz. deploy/README.md)}"
      R2__AccountId: "${R2__AccountId:-}"
      R2__AccessKeyId: "${R2__AccessKeyId:-}"
      R2__SecretAccessKey: "${R2__SecretAccessKey:-}"
      R2__BucketName: "${R2__BucketName:-}"
      # WhatsApp Cloud API (2026-07-27). AppSecret webhook imzasını
      # (X-Hub-Signature-256), VerifyToken Meta'nın abonelik doğrulamasını
      # karşılar — ikisi de boşsa webhook her isteği 403 ile reddeder.
      # Provider "cloud" giden Graph çağrılarını açar; gelen mesaj yolu
      # provider'dan bağımsız çalışır.
      # AppId + EmbeddedSignupConfigId panelin FB JS SDK'sını açar (Embedded
      # Signup). İkisi de gizli değil ama boş kalırsa yayıncı "Bağla" düğmesine
      # bastığında Meta penceresi hiç açılmaz. Burada listelenmeyen anahtar
      # container'a GİRMEZ — .env'e yazmak tek başına yetmiyor.
      OrderDeck__WhatsApp__Provider: "${OrderDeck__WhatsApp__Provider:?compose dosyasinin yanindaki .env icinde ayarla: cloud (bkz. deploy/README.md)}"
      OrderDeck__WhatsApp__AppSecret: "${OrderDeck__WhatsApp__AppSecret:-}"
      OrderDeck__WhatsApp__VerifyToken: "${OrderDeck__WhatsApp__VerifyToken:-}"
      OrderDeck__WhatsApp__AppId: "${OrderDeck__WhatsApp__AppId:-}"
      OrderDeck__WhatsApp__EmbeddedSignupConfigId: "${OrderDeck__WhatsApp__EmbeddedSignupConfigId:-}"
      # Masaüstünün Facebook/Instagram OAuth'u (2026-08-20). AppSecret SUNUCUDA
      # KALIR: code→token takasını sunucu yapar, masaüstü yalnız code gönderir.
      # Eskiden bu sır WPF binary'sine derlenmek zorundaydı; enjeksiyon adımı
      # yayın hattına hiç eklenmediği için sahaya BOŞ gidiyor ve her kurulumda
      # Facebook bağlantısı "App ID eksik" diye patlıyordu.
      # AppId/LoginConfigId gizli değil ama boşsa masaüstü OAuth penceresini
      # hiç açamaz. Bu, WhatsApp app'inden AYRI bir Meta app'idir — karıştırma.
      OrderDeck__Facebook__AppId: "${OrderDeck__Facebook__AppId:-}"
      OrderDeck__Facebook__AppSecret: "${OrderDeck__Facebook__AppSecret:-}"
      OrderDeck__Facebook__LoginConfigId: "${OrderDeck__Facebook__LoginConfigId:-}"
      # Kayıt formu "hesabınla bağlan" (PR #360, karanlık deploy). Bayraklar
      # yazılmadıkça uçlar 404 — Google doğrulaması ONAYLANMADAN
      # IntakeLogin__YouTubeEnabled açılmaz. Facebook sırrı yukarıdaki
      # OrderDeck__Facebook__* değerlerinden okunur; Google için AYRI "Web
      # application" client (masaüstününki değil). Bkz. docs/kayit-formu-giris.md
      #
      # Bayrak varsayılanı "false" ZORUNLU, boş string DEĞİL: .NET config
      # binder'ı boş string'i bool'a çeviremez ve options İLK OKUNDUĞUNDA
      # (yani form sayfasının her isteğinde) exception fırlatır. 2026-09-04'te
      # `:-` (boş varsayılan) prod kayıt formunu ~17 dk 500'e düşürdü; smoke
      # test /ready'ye baktığı için yakalamadı.
      IntakeLogin__GoogleClientId: "${IntakeLogin__GoogleClientId:-}"
      IntakeLogin__GoogleClientSecret: "${IntakeLogin__GoogleClientSecret:-}"
      IntakeLogin__YouTubeEnabled: "${IntakeLogin__YouTubeEnabled:-false}"
      IntakeLogin__FacebookEnabled: "${IntakeLogin__FacebookEnabled:-false}"
      # OpenTelemetry export. Set OTEL_EXPORTER_OTLP_ENDPOINT in .env to push
      # traces+metrics to a collector (Grafana Cloud, Honeycomb, Tempo, etc.).
      # Empty = no push; /metrics scrape endpoint still works regardless.
      OTEL_EXPORTER_OTLP_ENDPOINT: "${OTEL_EXPORTER_OTLP_ENDPOINT:-}"
      OTEL_EXPORTER_OTLP_HEADERS: "${OTEL_EXPORTER_OTLP_HEADERS:-}"
    volumes:
      # Host yolu DEĞİŞMEDİ (./keys), yalnız konteyner içindeki hedefi değişti:
      # eskiden /root/.aspnet/DataProtection-Keys idi, çünkü uygulama anahtarları
      # $HOME altında arıyordu. Artık yol DataProtection__KeysPath ile sabit.
      # Aynı host dizini = aynı key-*.xml dosyaları = mevcut şifreli veriler açılır.
      - ./keys:/app/keys
      - ./backups:/app/Backups
      # /tmp bilerek tmpfs DEĞİL. Yedek görüntüleyici ve haftalık restore
      # tatbikatı 64 MB'a kadar zarfı buraya açıp içindeki .db'yi çıkarıyor;
      # tmpfs konteynerin bellek cgroup'una sayıldığı için aşağıdaki mem_limit
      # ile aynı bütçeden yerdi ve tatbikat OOM'la düşerdi. Disk destekli.
      - ./tmp:/tmp
      # FCM servis hesabı anahtarı — host'ta duruyor, imaja girmiyor.
      # 0600 olduğu için host'ta uid 1654'e chown edilmiş olmalı, yoksa
      # konteyner dosyayı okuyamaz ve push bildirimleri sessizce ölür.
      - /etc/orderdeck/firebase-service-account.json:/etc/orderdeck/firebase-service-account.json:ro
    networks:
      - web
    expose:
      - "8080"
    # Denetim O-11 sertleştirmesi. Konteyner imajdaki `app` (uid 1654) olarak
    # koşuyor (bkz. Dockerfile USER). read_only kök dosya sistemini kilitler;
    # yazılabilir tek yerler yukarıdaki üç bind mount.
    read_only: true
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    # Cap memory/CPU so a backup-upload retry loop or a Hangfire worker storm
    # can't OOM the VPS and take SQL Server down with it.
    mem_limit: 1g
    memswap_limit: 1g
    cpus: 1.0

  caddy:
    image: caddy:2-alpine
    container_name: orderdeck-caddy
    restart: unless-stopped
    depends_on:
      - license-server
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      # Marketing sitesinin statik build çıktısı. CI ya da elle rsync ile
      # /opt/orderdeck/web-out altına kopyalandıktan sonra Caddy file_server
      # bu klasörü servis ediyor. Read-only mount → container içinden değiştirilemez.
      - ./web-out:/srv/web:ro
      # EMAR GLOBAL kurumsal sitesi (emarglobal.com) — ayrı repodan rsync'lenir.
      - ./emar-out:/srv/emar:ro
      # OrderDeck Panel web sürümü (panel.orderdeckapp.com) — Mobile deposundan
      # CI ile rsync'lenir.
      - ./panel-out:/srv/panel:ro
      - caddy_data:/data
      - caddy_config:/config
    networks:
      - web
    # cap_drop: ALL root'tan da NET_BIND_SERVICE'i alır, o olmadan 80/443
    # bağlanamaz — bu yüzden tek yetenek geri veriliyor. read_only EKLENMEDİ:
    # Caddy ACME sertifikalarını ve OCSP staple'ını çalışırken yazıyor, bunu
    # kilitlemenin bedeli sertifika yenilenmemesi olur ve arıza ancak 60 gün
    # sonra görünür.
    security_opt:
      - no-new-privileges:true
    cap_drop:
      - ALL
    cap_add:
      - NET_BIND_SERVICE
    mem_limit: 256m
    memswap_limit: 256m
    cpus: 1.0

volumes:
  caddy_data:
  caddy_config:

networks:
  web:
